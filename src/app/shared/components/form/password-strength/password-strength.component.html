<div class="my-2">
  <progress class="progress w-full" [class]="progressColor()" [value]="level()" max="5"></progress>
  <ul class="mt-1 text-xs space-y-1">
    @for (rule of rules(); track rule.label) {
      <li class="flex items-center gap-2" [class.text-success]="rule.met" [class.text-base-content/60]="!rule.met">
        <i class="fa-solid" [class.fa-check]="rule.met" [class.fa-xmark]="!rule.met"></i>
        {{ rule.label }}
      </li>
    }
  </ul>
</div>
